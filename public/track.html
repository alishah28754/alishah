<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track Your Order — KTEX</title>
<style>
  :root {
    --ink: #171310;
    --ink-soft: #241f19;
    --card: #FBF7EF;
    --card-line: #E7DDC7;
    --gold: #C9A24B;
    --gold-deep: #A9822F;
    --bronze: #8C7A5C;
    --bronze-soft: #B5A688;
    --green: #5B8C5A;
    --red: #B5544A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201,162,75,0.08), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(201,162,75,0.06), transparent 40%);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 56px 20px 80px;
  }

  .wrap {
    width: 100%;
    max-width: 480px;
  }

  .brand {
    text-align: center;
    margin-bottom: 32px;
  }

  .brand-mark {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--gold);
  }

  .brand-mark span {
    color: var(--bronze-soft);
    font-weight: 400;
  }

  .card {
    background: var(--card);
    border-radius: 4px;
    padding: 40px 36px 36px;
    position: relative;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  }

  .card::before,
  .card::after {
    content: '';
    position: absolute;
    left: 22px; right: 22px;
    height: 1px;
    background-image: linear-gradient(90deg, var(--gold) 0 6px, transparent 6px 12px);
    background-size: 12px 1px;
    opacity: 0.55;
  }
  .card::before { top: 12px; }
  .card::after { bottom: 12px; }

  .eyebrow {
    font-size: 12px;
    color: var(--bronze);
    margin: 0 0 6px;
  }

  .order-id {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px;
    font-weight: 500;
    color: var(--ink);
    margin: 0 0 24px;
    word-break: break-word;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px 7px 12px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 32px;
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; }

  .stitch {
    border: none;
    border-top: 1px dashed var(--card-line);
    margin: 28px 0;
  }

  .timeline { list-style: none; margin: 0; padding: 0; }

  .timeline li {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 14px;
    padding-bottom: 26px;
    position: relative;
  }
  .timeline li:last-child { padding-bottom: 0; }

  .timeline li::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 22px;
    bottom: -4px;
    width: 1px;
    background: var(--card-line);
  }
  .timeline li:last-child::before { display: none; }

  .node {
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    border: 1.5px solid var(--card-line);
    background: var(--card);
    color: var(--bronze-soft);
    z-index: 1;
  }
  .node.done {
    background: var(--gold);
    border-color: var(--gold-deep);
    color: var(--card);
  }
  .node.current {
    background: var(--ink);
    border-color: var(--gold);
    color: var(--gold);
  }

  .tl-label {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .tl-sub {
    font-size: 12.5px;
    color: var(--bronze);
    line-height: 1.5;
  }
  .timeline li:not(.active) .tl-label { color: var(--bronze-soft); }

  .meta-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-top: 1px solid var(--card-line);
    font-size: 13.5px;
  }
  .meta-row:first-of-type { border-top: none; }
  .meta-label { color: var(--bronze); }
  .meta-value { color: var(--ink); font-weight: 500; text-align: right; }

  .foot {
    text-align: center;
    margin-top: 28px;
    font-size: 12.5px;
    color: var(--bronze-soft);
    line-height: 1.7;
  }
  .foot a { color: var(--gold); text-decoration: none; }

  .state {
    text-align: center;
    padding: 50px 20px;
  }
  .state .glyph {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 34px;
    color: var(--gold);
    margin-bottom: 12px;
  }
  .state h2 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 500;
    font-size: 19px;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .state p {
    font-size: 14px;
    color: var(--bronze);
    margin: 0 0 22px;
    line-height: 1.6;
  }
  .retry {
    display: inline-block;
    background: var(--ink);
    color: var(--gold);
    border: none;
    padding: 10px 22px;
    border-radius: 4px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .retry:hover { background: var(--ink-soft); }

  .skeleton {
    background: linear-gradient(90deg, var(--card-line) 25%, #f2ead7 37%, var(--card-line) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 3px;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  @media (prefers-reduced-motion: reduce) {
    .skeleton { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">KTEX <span>· ORDER TRACKING</span></div>
    </div>
    <div class="card" id="card">
      <div class="state" id="loadingState">
        <div class="skeleton" style="height:14px; width:40%; margin:0 auto 14px;"></div>
        <div class="skeleton" style="height:26px; width:70%; margin:0 auto 24px;"></div>
        <div class="skeleton" style="height:60px; width:100%; margin-bottom:14px;"></div>
        <div class="skeleton" style="height:60px; width:100%;"></div>
      </div>
    </div>
    <div class="foot">
      Questions about your order? <a href="mailto:info@ktexstore.com" id="supportLink">Contact KTEX support</a>
    </div>
  </div>

<script>
(function () {
  const API_BASE = 'https://ktex.up.railway.app/api/orders/track/';

  const STEPS = ['Processing', 'Shipped', 'Delivered'];
  const STATUS_COLOR = {
    Processing: { bg: 'rgba(201,162,75,0.15)', fg: '#A9822F', dot: '#C9A24B' },
    Shipped:    { bg: 'rgba(91,124,192,0.15)', fg: '#3E5C99', dot: '#5B7CC0' },
    Delivered:  { bg: 'rgba(91,140,90,0.15)',  fg: '#3E6B3D', dot: '#5B8C5A' },
    Cancelled:  { bg: 'rgba(181,84,74,0.15)',  fg: '#8C3B32', dot: '#B5544A' },
    Refunded:   { bg: 'rgba(140,122,92,0.18)', fg: '#6B5D45', dot: '#8C7A5C' },
  };

  function getOrderId() {
    const params = new URLSearchParams(window.location.search);
    const fromQuery = params.get('order') || params.get('id');
    if (fromQuery) return fromQuery;
    // fallback: support /track/KTEX-xxxx style paths too
    const parts = window.location.pathname.split('/').filter(Boolean);
    return parts.length ? decodeURIComponent(parts[parts.length - 1]) : null;
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function formatDate(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch (e) { return iso; }
  }

  function setSupportLink(orderId) {
    const link = document.getElementById('supportLink');
    if (!link || !orderId) return;
    const subject = encodeURIComponent(`Order query — ${orderId}`);
    const body = encodeURIComponent(`Hi KTEX team,\n\nI have a question about my order ${orderId}.\n\n`);
    link.href = `mailto:info@ktexstore.com?subject=${subject}&body=${body}`;
  }

  function renderError(title, message, showRetry) {
    document.getElementById('card').innerHTML = `
      <div class="state">
        <div class="glyph">✦</div>
        <h2>${esc(title)}</h2>
        <p>${esc(message)}</p>
        ${showRetry ? '<button class="retry" id="retryBtn">Try again</button>' : ''}
      </div>`;
    const btn = document.getElementById('retryBtn');
    if (btn) btn.addEventListener('click', load);
  }

  function renderOrder(order) {
    const status = order.status || 'Processing';
    const isTerminalBad = status === 'Cancelled' || status === 'Refunded';
    const activeIndex = isTerminalBad ? -1 : STEPS.indexOf(status);
    const colors = STATUS_COLOR[status] || STATUS_COLOR.Processing;

    let timelineHtml = '';
    if (isTerminalBad) {
      timelineHtml = `
        <li class="active">
          <div class="node current">✕</div>
          <div>
            <div class="tl-label">${esc(status)}</div>
            <div class="tl-sub">${status === 'Cancelled' ? 'This order was cancelled.' : 'This order was refunded.'}</div>
          </div>
        </li>`;
    } else {
      const descriptions = {
        Processing: 'Order confirmed and being prepared.',
        Shipped: 'On its way to you.',
        Delivered: 'Delivered — thank you for shopping with KTEX.',
      };
      timelineHtml = STEPS.map((step, i) => {
        const done = i < activeIndex;
        const current = i === activeIndex;
        const nodeClass = done ? 'done' : current ? 'current' : '';
        const nodeContent = done ? '✓' : (i + 1);
        return `
          <li class="${current ? 'active' : ''}">
            <div class="node ${nodeClass}">${nodeContent}</div>
            <div>
              <div class="tl-label">${esc(step)}</div>
              <div class="tl-sub">${esc(descriptions[step])}</div>
            </div>
          </li>`;
      }).join('');
    }

    document.getElementById('card').innerHTML = `
      <p class="eyebrow">Order</p>
      <h1 class="order-id">${esc(order.id || '—')}</h1>
      <span class="status-pill" style="background:${colors.bg}; color:${colors.fg};">
        <span class="dot" style="background:${colors.dot};"></span>${esc(status)}
      </span>
      <ul class="timeline">${timelineHtml}</ul>
      <hr class="stitch" />
      <div class="meta-row"><span class="meta-label">Placed on</span><span class="meta-value">${esc(formatDate(order.date))}</span></div>
      <div class="meta-row"><span class="meta-label">Items</span><span class="meta-value">${esc(order.items)}</span></div>
      <div class="meta-row"><span class="meta-label">Total</span><span class="meta-value">PKR ${esc(order.total)}</span></div>
      ${order.tracking ? `<div class="meta-row"><span class="meta-label">Tracking ID</span><span class="meta-value">${esc(order.tracking)}</span></div>` : ''}
    `;
  }

  async function load() {
    const orderId = getOrderId();
    if (!orderId) {
      renderError('No order specified', 'This tracking link is missing an order number.', false);
      return;
    }

    setSupportLink(orderId);

    document.getElementById('card').innerHTML = `
      <div class="state" id="loadingState">
        <div class="skeleton" style="height:14px; width:40%; margin:0 auto 14px;"></div>
        <div class="skeleton" style="height:26px; width:70%; margin:0 auto 24px;"></div>
        <div class="skeleton" style="height:60px; width:100%; margin-bottom:14px;"></div>
        <div class="skeleton" style="height:60px; width:100%;"></div>
      </div>`;

    try {
      const res = await fetch(API_BASE + encodeURIComponent(orderId));
      const json = await res.json().catch(() => null);

      if (!res.ok || !json || json.success === false) {
        if (res.status === 404) {
          renderError('Order not found', `We couldn't find an order matching "${orderId}". Check the order number and try again.`, false);
        } else {
          renderError('Something went wrong', (json && json.message) || 'We could not load your order right now.', true);
        }
        return;
      }

      renderOrder(json.data || json);
    } catch (err) {
      renderError('Connection issue', 'Please check your internet connection and try again.', true);
    }
  }

  load();
})();
</script>
</body>
</html>

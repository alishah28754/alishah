name: ktex_home
description: "K-TEX shopping app - home page prototype"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.6

  # HTTP client for API calls (backend integration)
  http: ^1.1.0

  # Local storage for offline support
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0

  # State management
  provider: ^6.0.5

  # Environment variables
  flutter_dotenv: ^5.1.0

  # For better image loading with caching
  cached_network_image: ^3.3.0

  # ✅ ADD THIS - Shimmer loading effects
  shimmer: ^3.0.0

  # Image Picker for profile photos & screenshots
  image_picker: ^1.0.4

  # URL Launcher for WhatsApp
  url_launcher: ^6.3.2

  # Push Notifications
  firebase_messaging: ^15.2.6

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

  # Social Login
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.2.0

  # Map
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # For generating launcher icons
  flutter_launcher_icons: ^0.13.1

  # For code generation (if needed)
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - .env

# Launcher Icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ktex_logo.png"
  adaptive_icon_background: "#FFFFFF"
  min_sdk_android: 21